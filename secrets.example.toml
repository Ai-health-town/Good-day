# Copy to Streamlit -> App settings -> Secrets. Replace ALL placeholder values.
# Never upload a real .streamlit/secrets.toml or real credentials to GitHub.
DATABASE_URL = "postgresql://DATABASE_USER:DATABASE_PASSWORD@DATABASE_HOST:5432/DATABASE_NAME?sslmode=require"
GDAY_ADMIN_USERNAME = "your_admin_name"
GDAY_ADMIN_PASSWORD = "REPLACE_WITH_A_UNIQUE_PASSWORD_AT_LEAST_12_CHARACTERS"
GDAY_ADMIN_NAME = "مدير المنصة"
REMEMBER_DAYS = 90

# Local testing only: remove DATABASE_URL and set GDAY_LOCAL_MODE = true.
# For Streamlit Community Cloud keep local mode disabled.
GDAY_LOCAL_MODE = false

# OPTIONAL Neon Object Storage. Use a PRIVATE bucket provisioned in Neon.
# Uncomment all five only after copying actual values from Connect -> Storage.
# AWS_ENDPOINT_URL_S3 = "https://YOUR_STORAGE_HOST.neon.tech"
# AWS_REGION = "YOUR_REGION"
# AWS_ACCESS_KEY_ID = "REPLACE_WITH_STORAGE_ACCESS_KEY"
# AWS_SECRET_ACCESS_KEY = "REPLACE_WITH_STORAGE_SECRET"
# NEON_STORAGE_BUCKET = "gday-private"

# OPTIONAL Neon AI Gateway. The base URL is the bare HTTPS branch host, no /v1.
# Requires a supported region, a paid Neon plan and prepaid inference credits.
# NEON_AI_GATEWAY_BASE_URL = "https://YOUR_GATEWAY_HOST.neon.tech"
# NEON_AI_GATEWAY_TOKEN = "REPLACE_WITH_GATEWAY_TOKEN"
# NEON_AI_MODEL = "COPY_MODEL_ID_FROM_NEON"
# GDAY_AI_DAILY_LIMIT = 40
# GDAY_AI_MAX_OUTPUT_TOKENS = 1800
